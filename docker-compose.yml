services:
  postgres:
    image: postgres:18
    command: ["postgres", "-c", "fsync=on", "-c", "synchronous_commit=on", "-c", "full_page_writes=on"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rabbu_mvp}
      POSTGRES_USER: ${POSTGRES_USER:-gabrisel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque_por_uma_senha_segura}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:24-bookworm-slim
    stop_grace_period: 20s
    working_dir: /app
    command: ["npm", "run", "dev"]
    restart: unless-stopped
    environment:
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Sao_Paulo}
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DATABASE_URL: postgresql://${API_DB_USER:-rephouse_api}:${API_DB_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-rabbu_mvp}?schema=public
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./codigo:/app/codigo:ro
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./ferramentas/contrato/package.json:/app/ferramentas/contrato/package.json:ro
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Uso administrativo explícito. A API não depende deste serviço e não recebe suas credenciais.
  migracoes:
    profiles: ["manutencao"]
    image: node:24-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci && npm run db:generate && npm run db:deploy"
    environment:
      NODE_ENV: development
      REPHOUSE_LOCAL_MAINTENANCE: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-gabrisel}:${POSTGRES_PASSWORD:-troque_por_uma_senha_segura}@postgres:5432/${POSTGRES_DB:-rabbu_mvp}?schema=public
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:24-bookworm-slim
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://api:3000
      REPHOUSE_VITE_POLLING: ${REPHOUSE_VITE_POLLING:-true}
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./interface:/app
      - frontend_node_modules:/app/node_modules
      - ./integracao:/integracao:ro

volumes:
  postgres_data:
  api_node_modules:
  frontend_node_modules:
