services:
  postgres:
    image: postgres:18
    command: ["postgres", "-c", "fsync=on", "-c", "synchronous_commit=on", "-c", "full_page_writes=on"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rabbu_mvp}
      POSTGRES_USER: ${POSTGRES_USER:-gabrisel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque_por_uma_senha_segura}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:24-bookworm-slim
    stop_grace_period: 20s
    working_dir: /app
    command: sh -c "npm ci && npm run db:generate && npm run db:deploy && npm run dev"
    restart: unless-stopped
    environment:
      NODE_ENV: development
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Sao_Paulo}
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-gabrisel}:${POSTGRES_PASSWORD:-troque_por_uma_senha_segura}@postgres:5432/${POSTGRES_DB:-rabbu_mvp}?schema=public
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - comprovantes_data:/app/armazenamento/comprovantes
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: node:24-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./interface:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  api_node_modules:
  frontend_node_modules:
  comprovantes_data:
