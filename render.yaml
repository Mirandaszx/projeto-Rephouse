# Reutilizar o Web Service rephouse e seu PostgreSQL existente.
# Antes de aplicar, conferir nome/região no painel e revisar o plano do Blueprint.
# Segredos são preenchidos no Render; nenhum valor do .env entra neste arquivo.
services:
  - type: web
    name: rephouse
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./infra/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    # Durante a configuração, implantar somente após conferir o commit e o ambiente.
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: TRUST_PROXY
        value: "1"
      - key: APP_TIME_ZONE
        value: America/Sao_Paulo
      - key: APP_PUBLIC_URL
        value: https://rephouse.onrender.com
      - key: CORS_ORIGINS
        value: https://rephouse.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Escolher somente Brevo neste ambiente.
      - key: RESEND_API_KEY
        value: ""

# Não declarar databases aqui: preservar o banco já provisionado e seus dados.
