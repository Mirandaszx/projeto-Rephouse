filebeat.inputs:
  - type: filestream
    id: rephouse-api-kubernetes
    prospector.scanner.symlinks: true
    parsers:
      - container: ~
      - ndjson:
          target: ""
          add_error_key: true
          expand_keys: false
    paths:
      - /var/log/containers/api-*_rephouse-demo_api-*.log
processors:
  - timestamp:
      field: timestamp
      layouts: ['2006-01-02T15:04:05.999Z']
      ignore_missing: true
  - fingerprint:
      fields: [timestamp, event, requestId]
      target_field: '@metadata._id'
      method: sha256
      ignore_missing: true
  - add_fields:
      target: ""
      fields:
        deployment.environment.name: demo-local
  - drop_event:
      when:
        not:
          has_fields: ['event']
output.elasticsearch:
  hosts: ['https://elasticsearch:9200']
  api_key: '${FILEBEAT_API_KEY}'
  ssl.certificate_authorities: ['/certs/ca.crt']
  index: 'rephouse-api-%{+yyyy.MM.dd}'
setup.ilm.enabled: false
setup.template.enabled: false
logging.level: warning
logging.to_files: false
http.enabled: true
http.host: 0.0.0.0
http.port: 5066
