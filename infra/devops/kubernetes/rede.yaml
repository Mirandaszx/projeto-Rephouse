# Firewall interno da demo: tudo bloqueado por padrão, liberado só o caminho
# frontend -> api -> postgres (e o Job de preparação -> postgres), mais o DNS do cluster.
# O tráfego do kubelet (probes) e do kubectl port-forward não passa por estas regras.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: bloquear-por-padrao, namespace: rephouse-demo}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: permitir-dns, namespace: rephouse-demo}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: frontend, namespace: rephouse-demo}
spec:
  podSelector: {matchLabels: {app: frontend}}
  policyTypes: [Ingress, Egress]
  # Porta pública da aplicação (hoje via port-forward; no futuro, via Ingress).
  ingress: [{ports: [{protocol: TCP, port: 8080}]}]
  egress: [{to: [{podSelector: {matchLabels: {app: api}}}], ports: [{protocol: TCP, port: 3000}]}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api, namespace: rephouse-demo}
spec:
  podSelector: {matchLabels: {app: api}}
  policyTypes: [Ingress, Egress]
  ingress: [{from: [{podSelector: {matchLabels: {app: frontend}}}], ports: [{protocol: TCP, port: 3000}]}]
  # Na demo a API não usa serviços externos (e-mail e Google ficam desligados).
  egress: [{to: [{podSelector: {matchLabels: {app: postgres}}}], ports: [{protocol: TCP, port: 5432}]}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgres, namespace: rephouse-demo}
spec:
  podSelector: {matchLabels: {app: postgres}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: api}}}, {podSelector: {matchLabels: {app: preparar-demo}}}]
      ports: [{protocol: TCP, port: 5432}]
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: preparar-demo, namespace: rephouse-demo}
spec:
  podSelector: {matchLabels: {app: preparar-demo}}
  policyTypes: [Ingress, Egress]
  egress: [{to: [{podSelector: {matchLabels: {app: postgres}}}], ports: [{protocol: TCP, port: 5432}]}]
