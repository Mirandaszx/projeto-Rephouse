apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: rephouse-demo
data:
  NODE_ENV: production
  PORT: "3000"
  APP_TIME_ZONE: America/Sao_Paulo
  # 5175: Vite de desenvolvimento apontando para a API da demo (5173 é o frontend do ambiente principal).
  CORS_ORIGINS: http://localhost:5180,http://127.0.0.1:5180,http://localhost:5175,http://127.0.0.1:5175
  TRUST_PROXY: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: rephouse-demo
spec:
  clusterIP: None
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: rephouse-demo
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: postgres:18.3-bookworm
          args: ["-c", "fsync=on", "-c", "synchronous_commit=on", "-c", "full_page_writes=on", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "log_statement=none", "-c", "log_min_error_statement=panic"]
          env:
            - {name: POSTGRES_DB, value: rephouse_devops_demo}
            - {name: POSTGRES_USER, value: rephouse_demo_admin}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: database-admin, key: POSTGRES_PASSWORD}}}
            - {name: PGDATA, value: /var/lib/postgresql/18/docker}
          ports: [{containerPort: 5432}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe: {exec: {command: [pg_isready, -U, rephouse_demo_admin, -d, rephouse_devops_demo]}, periodSeconds: 5, timeoutSeconds: 3}
          livenessProbe: {exec: {command: [pg_isready, -U, rephouse_demo_admin, -d, rephouse_devops_demo]}, initialDelaySeconds: 30, periodSeconds: 10, timeoutSeconds: 3}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: socket, mountPath: /var/run/postgresql}
      volumes: [{name: socket, emptyDir: {}}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: rephouse-demo}
spec:
  selector: {app: api}
  ports: [{port: 3000, targetPort: 3000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: rephouse-demo}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: {matchLabels: {app: api}}
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  template:
    metadata: {labels: {app: api}}
    spec:
      automountServiceAccountToken: false
      # 5s para propagação dos endpoints + até 15s de drenagem da API + margem.
      terminationGracePeriodSeconds: 25
      # Imagem distroless: usuário nonroot 65532 e node em /nodejs/bin/node (fora do PATH).
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: rephouse-api:local
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: app-config}}, {secretRef: {name: api-runtime}}]
          ports: [{containerPort: 3000}]
          lifecycle:
            preStop:
              exec: {command: [/nodejs/bin/node, -e, 'setTimeout(() => {}, 5000)']}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 192Mi}, limits: {cpu: "1", memory: 512Mi}}
          startupProbe: {httpGet: {path: /api/health, port: 3000}, periodSeconds: 3, failureThreshold: 40}
          readinessProbe: {httpGet: {path: /api/ready, port: 3000}, periodSeconds: 5, timeoutSeconds: 2}
          livenessProbe: {httpGet: {path: /api/health, port: 3000}, periodSeconds: 10, timeoutSeconds: 2}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 32Mi}}]
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: rephouse-demo}
spec:
  selector: {app: frontend}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: rephouse-demo}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: frontend
          image: rephouse-frontend:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 500m, memory: 96Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 32Mi}}]
